name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android/iOS project files
        working-directory: app
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --project-name pc_shutdown --org com.shutdownscheduler --platforms android,ios .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test
          python3 ../tools/patch_platforms.py .
          flutter pub get
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ShutdownScheduler-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android/iOS project files
        working-directory: app
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --project-name pc_shutdown --org com.shutdownscheduler --platforms android,ios .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test
          python3 ../tools/patch_platforms.py .
          flutter pub get
      - name: Build iOS app (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ShutdownScheduler-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShutdownScheduler-ios-unsigned-ipa
          path: app/ShutdownScheduler-unsigned.ipa
